
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Login | RawStock</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101a35, #183b65);
            color: #172033;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px #0004;
        }
        .logo {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: #173b70;
            color: #f6c85f;
            font-size: 28px;
            font-weight: bold;
        }
        h1 { margin-bottom: 8px; }
        .muted { color: #687386; line-height: 1.5; }
        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbe5;
            border-radius: 9px;
            font-size: 15px;
        }
        input:focus {
            outline: 2px solid #8db6ed;
            border-color: #245a9b;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #173b70;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: wait; }
        #message { margin-top: 16px; font-size: 14px; }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="logo">R</div>
        <h1>Supplier Login</h1>
        <p class="muted">Sign in to manage your RawStock supply requests.</p>

        <form id="supplierLoginForm">
            <label for="username">Username</label>
            <input id="username" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button id="loginButton" type="submit">Sign In</button>
            <p id="message" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="js/frontend/supplier-login.js"></script>
</body>
</html>
