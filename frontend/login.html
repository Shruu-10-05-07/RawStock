
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RawStock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101a35, #204d7b);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 60px #0004;
        }

        .logo {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #173b70;
            color: #f6c85f;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 8px;
            color: #172033;
        }

        .subtitle {
            color: #687386;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #172033;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbe5;
            border-radius: 9px;
            font-size: 15px;
            background: #fff;
        }

        input:focus,
        select:focus {
            outline: 2px solid #9bbce8;
            border-color: #173b70;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 9px;
            background: #173b70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #24538e;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #b42318;
        }

        .success {
            color: #176c43;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #687386;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="logo">R</div>

        <h1>Welcome to RawStock</h1>

        <p class="subtitle">
            Sign in to access your inventory and supply management dashboard.
        </p>

        <form id="loginForm">

            <label for="role">Login As</label>

            <select id="role" name="role" required>
                <option value="ADMIN">Admin</option>
                <option value="SUPPLIER">Supplier</option>
            </select>

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Sign In
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <div class="footer">
            RawStock Inventory Management System
        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
